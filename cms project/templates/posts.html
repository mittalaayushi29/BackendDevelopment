<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple CMS</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <div class="header">

            <div>
                <h1>Simple CMS</h1>
                <p class="subtitle">
                    Backend Development Lab
                </p>
            </div>

            <a href="{{ url_for('new_post') }}"
               class="button">
                + Create Post
            </a>

        </div>


        <h2>Blog Posts</h2>


        {% if posts %}

            {% for post in posts %}

                <div class="post-card">

                    <h3>

                        <a href="{{ url_for('show_post', post_id=post._id) }}">
                            {{ post.title }}
                        </a>

                    </h3>

                    <p class="post-meta">

                        By {{ post.author }}

                        <span>•</span>

                        {{ post.createdAt.strftime('%d %B %Y') }}

                    </p>

                </div>

            {% endfor %}


        {% else %}

            <div class="empty">

                <h3>No posts yet</h3>

                <p>
                    Create your first blog post.
                </p>

                <a href="{{ url_for('new_post') }}"
                   class="button">

                    Create Post

                </a>

            </div>

        {% endif %}

    </div>

</body>

</html>
