<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container small-container">

        <a href="{{ url_for('show_posts') }}"
           class="back-link">

            ← Back to Posts

        </a>


        <div class="form-card">

            <h1>Create New Post</h1>

            <p class="subtitle">
                Add a new article to Simple CMS
            </p>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form action="{{ url_for('create_post') }}"
                  method="POST">


                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ title or '' }}"
                        placeholder="Enter post title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="author">
                        Author
                    </label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        value="{{ author or '' }}"
                        placeholder="Enter author name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="content">
                        Content
                    </label>

                    <textarea
                        id="content"
                        name="content"
                        rows="10"
                        placeholder="Write your blog post..."
                        required
                    >{{ content or '' }}</textarea>

                </div>


                <button type="submit"
                        class="button">

                    Publish Post

                </button>

            </form>

        </div>

    </div>

</body>

</html>
