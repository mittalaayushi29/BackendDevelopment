<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tailwind Responsive Page</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="text-slate-800">


<nav class="bg-slate-900 text-white">

    <div class="
        max-w-6xl
        mx-auto
        px-6
        py-5
        flex
        flex-col
        md:flex-row
        justify-between
        items-center
        gap-4">

        <h1 class="text-2xl font-bold">
            TechWorld
        </h1>

        <div class="flex gap-6">

            <a href="#">
                Home
            </a>

            <a href="#features">
                Features
            </a>

            <a href="#about">
                About
            </a>

        </div>

    </div>

</nav>


<section class="
    bg-slate-100
    text-center
    py-24">

    <h1 class="
        text-4xl
        md:text-6xl
        font-bold">

        Build Modern Web Experiences

    </h1>

    <p class="
        text-lg
        mt-5">

        Responsive design using Tailwind CSS.

    </p>

    <a
        href="#features"
        class="
            inline-block
            mt-6
            bg-slate-900
            text-white
            px-6
            py-3
            rounded">

        Explore Features

    </a>

</section>


<section
    id="features"
    class="max-w-6xl mx-auto py-16 px-6">

    <h2 class="
        text-3xl
        font-bold
        text-center
        mb-10">

        Features

    </h2>


    <div class="
        grid
        grid-cols-1
        md:grid-cols-3
        gap-6">


        <div class="
            bg-slate-100
            rounded-lg
            p-8
            text-center">

            <h3 class="text-xl font-bold">
                Responsive
            </h3>

            <p class="mt-3">
                Tailwind responsive utility classes.
            </p>

        </div>


        <div class="
            bg-slate-100
            rounded-lg
            p-8
            text-center">

            <h3 class="text-xl font-bold">
                Utility First
            </h3>

            <p class="mt-3">
                Build designs using utility classes.
            </p>

        </div>


        <div class="
            bg-slate-100
            rounded-lg
            p-8
            text-center">

            <h3 class="text-xl font-bold">
                Flexible
            </h3>

            <p class="mt-3">
                Easily customize page layouts.
            </p>

        </div>


    </div>

</section>


<footer class="
    bg-slate-900
    text-white
    text-center
    py-6">

    Tailwind Version

</footer>

</body>
</html>
